name: Deploy Portfolio to S3

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Remove S3 Block Public Access
        run: |
          aws s3api put-public-access-block \
            --bucket mustansar.haseebxbiz.dev \
            --public-access-block-configuration "BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false"

      - name: Deploy to S3
        run: |
          aws s3 sync . s3://mustansar.haseebxbiz.dev \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "infra/*" \
            --delete

      - name: Set Public Policy
        run: |
          aws s3api put-bucket-policy --bucket mustansar.haseebxbiz.dev --policy '{
            "Version": "2012-10-17",
            "Statement": [{
              "Sid": "PublicReadGetObject",
              "Effect": "Allow",
              "Principal": "*",
              "Action": "s3:GetObject",
              "Resource": "arn:aws:s3:::mustansar.haseebxbiz.dev/*"
            }]
          }'
